version: '3.8'

services:
  # 1. AI Ecommerce Express & React Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_ecommerce_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ai_admin}:${POSTGRES_PASSWORD:-postgres_secure_2026}@postgres:5432/${POSTGRES_DB:-ai_ecommerce}
    volumes:
      - app_data:/app/data_db
      - app_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai_ecom_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 2. PostgreSQL 15 Relational Database
  postgres:
    image: postgres:15-alpine
    container_name: ai_ecommerce_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ai_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - ai_ecom_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_admin} -d ${POSTGRES_DB:-ai_ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Nginx Reverse Proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: ai_ecommerce_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ai-ecommerce.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - ai_ecom_network

volumes:
  postgres_data:
    driver: local
  app_data:
    driver: local
  app_logs:
    driver: local

networks:
  ai_ecom_network:
    driver: bridge
